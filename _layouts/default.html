<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <!--<div class="py-5">-->
    <div>
      <div class="container page-content">
          {{ content }}
      </div>
    </div>

    {%- include footer.html -%}

    <div class="modal fade" id="site-settings" tabindex="-1" aria-labelledby="site-settings-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content settings-modal">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="site-settings-title">Display settings</h2>
            <button type="button" class="settings-close-button" data-bs-dismiss="modal" aria-label="Close settings">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="m6 6 12 12M18 6 6 18"></path>
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <fieldset class="settings-group">
              <legend>Colorblind friendly palettes</legend>
              <p class="settings-help">Choose one palette at a time. These adjust interface colors and are not vision simulations.</p>
              <div class="form-check form-switch">
                <input class="form-check-input color-vision-toggle" type="checkbox" role="switch" id="dichromacy-toggle" value="dichromacy">
                <label class="form-check-label" for="dichromacy-toggle">Dichromacy</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input color-vision-toggle" type="checkbox" role="switch" id="trichromacy-toggle" value="trichromacy">
                <label class="form-check-label" for="trichromacy-toggle">Trichromacy</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input color-vision-toggle" type="checkbox" role="switch" id="protanopia-toggle" value="protanopia">
                <label class="form-check-label" for="protanopia-toggle">Protanopia</label>
              </div>
            </fieldset>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
          </div>
        </div>
      </div>
    </div>

    <button class="back-to-top" id="back-to-top" type="button" aria-label="Scroll to top" title="Scroll to top" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <path d="M12 19V5m-7 7 7-7 7 7"></path>
      </svg>
    </button>
    <script src="{{ '/assets/javascript/back_to_top.js' | relative_url }}" defer></script>

  </body>

</html>
